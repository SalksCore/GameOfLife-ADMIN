<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a5c"/>
      <stop offset="0.45" stop-color="#7a4f8f"/>
      <stop offset="0.72" stop-color="#e9806a"/>
      <stop offset="0.9" stop-color="#ffbf7a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset="0.35" stop-color="#ffb070" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5468"/>
      <stop offset="1" stop-color="#3f3a4c"/>
    </linearGradient>
    <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a6a4"/>
      <stop offset="1" stop-color="#9e8b8c"/>
    </linearGradient>
    <linearGradient id="glassT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f3e70"/>
      <stop offset="0.65" stop-color="#4d64a3"/>
      <stop offset="1" stop-color="#e98a6c"/>
    </linearGradient>
    <pattern id="lit" width="22" height="26" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="15" height="17" fill="#ffd27a" opacity="0.85"/>
    </pattern>
    <pattern id="dark" width="22" height="26" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="15" height="17" fill="#1f2547" opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ciel au coucher du soleil -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.8">
    <circle cx="140" cy="80" r="2"/><circle cx="320" cy="140" r="1.5"/><circle cx="520" cy="60" r="2"/><circle cx="760" cy="110" r="1.5"/>
    <circle cx="980" cy="70" r="2"/><circle cx="1200" cy="120" r="1.5"/><circle cx="1420" cy="60" r="2"/><circle cx="1540" cy="150" r="1.5"/>
  </g>
  <circle cx="800" cy="560" r="300" fill="url(#sun)"/>
  <circle cx="800" cy="575" r="80" fill="#ffd79a"/>

  <!-- Skyline lointaine -->
  <g fill="#5b3f6e" opacity="0.75">
    <rect x="40" y="420" width="70" height="250"/><rect x="120" y="380" width="50" height="290"/><rect x="460" y="400" width="60" height="270"/>
    <rect x="1020" y="360" width="70" height="310"/><rect x="1100" y="420" width="50" height="250"/><rect x="1480" y="390" width="70" height="280"/>
    <path d="M1300 670V430l40-30 40 30v240z"/>
  </g>
  <g fill="#ffd27a" opacity="0.35">
    <rect x="52" y="440" width="10" height="12"/><rect x="80" y="470" width="10" height="12"/><rect x="132" y="410" width="10" height="12"/><rect x="1036" y="390" width="10" height="12"/><rect x="1060" y="440" width="10" height="12"/><rect x="1500" y="420" width="10" height="12"/>
  </g>

  <!-- Trottoir et rue -->
  <rect y="690" width="1600" height="60" fill="url(#walk)"/>
  <rect y="750" width="1600" height="150" fill="url(#road)"/>
  <g fill="#e8dfc8" opacity="0.7"><rect x="40" y="818" width="80" height="8" rx="4"/><rect x="200" y="818" width="80" height="8" rx="4"/><rect x="360" y="818" width="80" height="8" rx="4"/><rect x="900" y="818" width="80" height="8" rx="4"/><rect x="1060" y="818" width="80" height="8" rx="4"/><rect x="1220" y="818" width="80" height="8" rx="4"/><rect x="1380" y="818" width="80" height="8" rx="4"/></g>
  <rect y="746" width="1600" height="6" fill="#d8c9c3"/>

  <!-- MAISON -->
  <g>
    <rect x="22" y="575" width="160" height="120" fill="#c98a74"/>
    <path d="M8 582l94-70 94 70z" fill="#5a3b4c"/>
    <rect x="86" y="628" width="34" height="67" rx="3" fill="#3e2a36"/>
    <rect x="36" y="610" width="36" height="34" rx="3" fill="#ffd27a" filter="url(#glow)"/>
    <rect x="134" y="610" width="36" height="34" rx="3" fill="#ffd27a" filter="url(#glow)"/>
    <rect x="200" y="640" width="70" height="8" fill="#7d6a64"/><g fill="#7d6a64"><rect x="204" y="648" width="4" height="46"/><rect x="226" y="648" width="4" height="46"/><rect x="248" y="648" width="4" height="46"/></g>
  </g>

  <!-- PÔLE EMPLOI -->
  <g>
    <rect x="290" y="580" width="160" height="115" fill="#e6e2ea"/>
    <rect x="282" y="566" width="176" height="20" rx="4" fill="#3b5ba5"/>
    <rect x="300" y="545" width="140" height="28" rx="6" fill="#3b5ba5"/>
    <text x="370" y="565" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="14" fill="#fff" letter-spacing="1">PÔLE EMPLOI</text>
    <rect x="304" y="600" width="70" height="60" rx="3" fill="#ffd27a" opacity="0.9"/>
    <rect x="390" y="610" width="46" height="85" rx="3" fill="#5a5468"/>
    <rect x="396" y="616" width="34" height="79" fill="#9fb3dc"/>
  </g>

  <!-- ATELIER : usine -->
  <g>
    <path d="M520 695V560l60-40v40l60-40v40l60-40v175z" fill="#8a6f78"/>
    <path d="M520 560l60-40v40l60-40v40l60-40" fill="none" stroke="#5a4650" stroke-width="5" stroke-linejoin="round"/>
    <rect x="690" y="440" width="26" height="140" fill="#6b5560"/>
    <g fill="#d9cfd2" opacity="0.5"><circle cx="712" cy="420" r="16"/><circle cx="730" cy="396" r="20"/><circle cx="756" cy="370" r="24"/></g>
    <rect x="540" y="600" width="44" height="34" fill="#ffd27a" opacity="0.85"/><rect x="600" y="600" width="44" height="34" fill="#ffd27a" opacity="0.85"/>
    <rect x="590" y="645" width="70" height="50" fill="#4a3a42"/>
    <g stroke="#6b5560" stroke-width="3"><path d="M590 655h70M590 667h70M590 679h70"/></g>
    <rect x="560" y="572" width="110" height="22" rx="4" fill="#4a3a42"/>
    <text x="615" y="588" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#ffd166" letter-spacing="2">ATELIER</text>
  </g>

  <!-- BUREAUX : tour vitrée -->
  <g>
    <rect x="820" y="250" width="190" height="445" fill="url(#glassT)"/>
    <rect x="820" y="250" width="190" height="445" fill="url(#dark)"/>
    <rect x="842" y="300" width="88" height="300" fill="url(#lit)"/>
    <rect x="952" y="380" width="44" height="160" fill="url(#lit)"/>
    <rect x="812" y="238" width="206" height="16" fill="#1f2547"/>
    <rect x="904" y="200" width="6" height="40" fill="#1f2547"/><circle cx="907" cy="198" r="5" fill="#ff5d5d" filter="url(#glow)"/>
    <rect x="870" y="630" width="90" height="65" fill="#1f2547"/>
    <rect x="878" y="638" width="34" height="57" fill="#ffd27a" opacity="0.8"/><rect x="918" y="638" width="34" height="57" fill="#ffd27a" opacity="0.8"/>
  </g>

  <!-- BANQUE -->
  <g>
    <rect x="1090" y="560" width="190" height="135" fill="#e9dcc9"/>
    <path d="M1078 566l107-56 107 56z" fill="#d8c6aa" stroke="#b39b78" stroke-width="5" stroke-linejoin="round"/>
    <rect x="1080" y="556" width="210" height="14" fill="#c4ae8c"/>
    <g fill="#f6eee1" stroke="#c4ae8c" stroke-width="2"><rect x="1104" y="580" width="18" height="100"/><rect x="1144" y="580" width="18" height="100"/><rect x="1208" y="580" width="18" height="100"/><rect x="1248" y="580" width="18" height="100"/></g>
    <rect x="1168" y="610" width="34" height="85" rx="3" fill="#4a3a42"/>
    <text x="1185" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#6b5560" letter-spacing="4">BANQUE</text>
    <path d="M1090 680h190v15h-190z" fill="#c4ae8c"/>
  </g>

  <!-- CLUB & AFTERWORK -->
  <g>
    <rect x="1350" y="565" width="190" height="130" fill="#3a2d4a"/>
    <rect x="1340" y="550" width="210" height="22" rx="4" fill="#24193a"/>
    <text x="1445" y="617" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#ff7ac8" letter-spacing="4" filter="url(#glow)">CLUB</text>
    <rect x="1366" y="630" width="70" height="50" rx="3" fill="#ffb46b" opacity="0.85"/>
    <rect x="1456" y="630" width="64" height="65" rx="3" fill="#24193a"/>
    <path d="M1458 635h60" stroke="#ff7ac8" stroke-width="3" filter="url(#glow)"/>
    <g><rect x="1556" y="600" width="4" height="95" fill="#d8c9c3"/><path d="M1560 602l26 10-26 10z" fill="#e63946"/></g>
  </g>

  <!-- COURS DU SOIR : arrêt avec panneau lumineux -->
  <g>
    <ellipse cx="768" cy="860" rx="110" ry="9" fill="#000" opacity="0.25"/>
    <rect x="700" y="760" width="6" height="96" fill="#2c2838"/><rect x="830" y="760" width="6" height="96" fill="#2c2838"/>
    <rect x="688" y="748" width="160" height="16" rx="4" fill="#2c2838"/>
    <rect x="710" y="772" width="118" height="54" rx="6" fill="#fff2cf" filter="url(#glow)"/>
    <text x="769" y="796" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#3b5ba5">COURS</text>
    <text x="769" y="815" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="13" fill="#3b5ba5">DU SOIR</text>
  </g>

  <!-- Lampadaires -->
  <g>
    <g><rect x="272" y="640" width="6" height="110" fill="#2c2838"/><path d="M275 640q0-16 22-16" fill="none" stroke="#2c2838" stroke-width="5"/><ellipse cx="300" cy="628" rx="10" ry="6" fill="#ffe7a8" filter="url(#glow)"/></g>
    <g><rect x="1040" y="640" width="6" height="110" fill="#2c2838"/><path d="M1043 640q0-16 22-16" fill="none" stroke="#2c2838" stroke-width="5"/><ellipse cx="1068" cy="628" rx="10" ry="6" fill="#ffe7a8" filter="url(#glow)"/></g>
    <g><rect x="1310" y="640" width="6" height="110" fill="#2c2838"/><path d="M1313 640q0-16 22-16" fill="none" stroke="#2c2838" stroke-width="5"/><ellipse cx="1338" cy="628" rx="10" ry="6" fill="#ffe7a8" filter="url(#glow)"/></g>
  </g>
  <!-- Voiture -->
  <g>
    <path d="M1150 860h150l-10-30-30-22h-60l-34 24z" fill="#e0574f"/>
    <path d="M1190 834l20-16h44l20 16z" fill="#9fb3dc"/>
    <circle cx="1180" cy="862" r="15" fill="#1f1b29"/><circle cx="1272" cy="862" r="15" fill="#1f1b29"/>
    <rect x="1290" y="836" width="10" height="8" rx="2" fill="#ffe7a8" filter="url(#glow)"/>
  </g>
</svg>
